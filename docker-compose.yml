# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: servicebay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    command: postgres -c timezone=UTC
volumes:
  pgdata:
